name: mavericks-vm
description: Run commands in a KVM-accelerated Mac OS X 10.9 guest on a Linux runner, vmactions-style
author: Mavergreen

# spec: docs/superpowers/specs/2026-10-06-mavericks-vm-design.md (in Mavergreen/packer-plugin-macosx)
#       -- the inputs are vmactions freebsd-vm v1.5.9's, by name, meaning and default, plus
#       image-key, cpu-model and cpu-isa; tests/inputs.bats holds the table
inputs:
  osname:
    description: The OS name. Only mavericks.
    default: mavericks
  prepare:
    description: Commands run in the guest before run
  run:
    description: Commands run in the guest
  release:
    description: The Mac OS X release. Only 10.9.
    default: '10.9'
  arch:
    description: The guest architecture. Only x86_64.
    default: x86_64
  envs:
    description: Names of environment variables to pass into the guest
  mem:
    description: Guest memory in MiB
    default: '4096'
  cpu:
    description: Guest CPU cores
    default: '2'
  nat:
    description: 'Port forwards from the runner to the guest, as "host": "guest" lines (udp:"host" for UDP)'
  usesh:
    description: Accepted and ignored, as vmactions does. prepare and run always use sh.
  sync:
    description: How the workspace reaches the guest and back -- rsync (default), scp, tar or no
    default: rsync
  copyback:
    description: Copy the workspace back from the guest after run
    default: 'true'
  debug:
    description: Print debug output
  data-dir:
    description: Where the guest's images live on the runner (default /mnt/mavericks-vm)
  cache-dir:
    description: Where the build's downloads are cached on the runner (default under data-dir)
  sync-time:
    description: Set the guest's clock from the runner's before run
  disable-cache:
    description: Never pull or push the cached guest; always build it
    default: 'false'
  cache-after-prepare:
    description: Cache the guest again after prepare, so later runs with the same prepare skip it
    default: 'false'
  cache-after-prepare-key-suffix:
    description: Extra value in the cache-after-prepare key; change it to run prepare again
    default: ''
  debug-on-error:
    description: On failure, print the guest's logs (a live screen is not yet supported)
    default: ''
  vnc-password:
    description: Accepted for vmactions compatibility; unused until debug-on-error offers a screen
    default: ''
  custom-shell-name:
    description: The name of the shell later steps may use as "shell <name> {0}"
    default: mavericks
  token:
    description: The GitHub token that pulls and pushes the cached guest (needs packages read/write)
    default: ${{ github.token }}
  image-key:
    description: An age identity (age-keygen) in a secret, which encrypts and decrypts the cached guest -- a repo's own, or Mavergreen's org secret MAVERICKS_VM_KEY
  cpu-isa:
    description: The guest CPU by the instructions it has -- none (no AVX; the default), avx (Sandy Bridge -- AVX, not AVX2, FMA or BMI) or avx2 (AVX2, FMA, BMI1 and BMI2 too); under KVM a level is what the guest is told, and the instructions above it still run on the runner's CPU; not with cpu-model
    default: ''
  cpu-model:
    description: The guest CPU model, as QEMU's -cpu, instead of cpu-isa; one that names no vendor gets vendor=GenuineIntel, which 10.9 needs on an AMD runner
    default: ''
  cache-store:
    description: Where the encrypted guest is cached -- auto (shared for Mavergreen repos, else repo), shared (Mavergreen's private registry) or repo (this repo's own actions/cache)
    default: auto

outputs:
  cache-after-prepare-hit:
    description: true when a prepared guest was restored and prepare was skipped
    value: ${{ steps.main.outputs.cache-after-prepare-hit }}

runs:
  using: composite
  steps:
    - name: Check the inputs
      shell: bash
      env:
        MVM_IN_OSNAME: ${{ inputs.osname }}
        MVM_IN_RELEASE: ${{ inputs.release }}
        MVM_IN_ARCH: ${{ inputs.arch }}
        MVM_IN_MEM: ${{ inputs.mem }}
        MVM_IN_CPU: ${{ inputs.cpu }}
        MVM_IN_CPU_MODEL: ${{ inputs.cpu-model }}
        MVM_IN_CPU_ISA: ${{ inputs.cpu-isa }}
        MVM_IN_SYNC: ${{ inputs.sync }}
        MVM_IN_COPYBACK: ${{ inputs.copyback }}
        MVM_IN_USESH: ${{ inputs.usesh }}
        MVM_IN_ENVS: ${{ inputs.envs }}
        MVM_IN_NAT: ${{ inputs.nat }}
        MVM_IN_HAS_IMAGE_KEY: ${{ inputs.image-key != '' }}
        MVM_IN_DISABLE_CACHE: ${{ inputs.disable-cache }}
        MVM_IN_CACHE_AFTER_PREPARE: ${{ inputs.cache-after-prepare }}
        MVM_IN_CACHE_AFTER_PREPARE_KEY_SUFFIX: ${{ inputs.cache-after-prepare-key-suffix }}
        MVM_IN_CUSTOM_SHELL_NAME: ${{ inputs.custom-shell-name }}
        MVM_IN_DATA_DIR: ${{ inputs.data-dir }}
        MVM_IN_CACHE_DIR: ${{ inputs.cache-dir }}
        MVM_IN_DEBUG: ${{ inputs.debug }}
        MVM_IN_SYNC_TIME: ${{ inputs.sync-time }}
        MVM_IN_DEBUG_ON_ERROR: ${{ inputs.debug-on-error }}
        MVM_IN_CACHE_STORE: ${{ inputs.cache-store }}
      run: bash "$GITHUB_ACTION_PATH/scripts/inputs.sh"

    - name: Make the data and cache directories
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/dirs.sh"

    # spec: docs/superpowers/specs/2026-10-06-mavericks-vm-design.md "Two tiers" (in
    #       packer-plugin-macosx) -- the repo tier keeps the encrypted guest in this repo's own
    #       actions/cache, restored after the input check so a fork without a key never downloads
    #       it, as an entry per image (base, layer, prepared), so a change that moves only the
    #       layer, or only prepare, never saves the ~6 GB base again. main.sh prunes the blob dir
    #       to this run's keys. The step is not run with the cache disabled, when main.sh computes
    #       no keys, nor in the registry tier. It fetches the base recipe once and outputs it for
    #       the main step; the recipe is never put in the job's environment, where a later step of
    #       another version would trust it.
    - name: The cache keys
      id: key
      if: env.MVM_STORE == 'file' && env.MVM_DISABLE_CACHE != 'true'
      shell: bash
      env:
        MVM_PREPARE: ${{ inputs.prepare }}
        MVM_BASE_RECIPE: ''
      run: |
        fail() { echo "::error title=mavericks-vm::computing the cache keys failed: $1"; exit 1; }
        key() { bash "$GITHUB_ACTION_PATH/scripts/key.sh" "$@"; }
        MVM_BASE_RECIPE="$(key --recipe)" || fail "the base recipe"
        export MVM_BASE_RECIPE
        base="$(key --base)" || fail "the base image's key"
        layer="$(key --layer)" || fail "the layer image's key"
        prepared=""
        if [ "$MVM_CACHE_AFTER_PREPARE" = true ] && [ -n "$MVM_PREPARE" ]; then prepared="$(key --prepared)" || fail "the prepared image's key"; fi
        { echo "base=$base"; echo "layer=$layer"; echo "prepared=$prepared"; echo "recipe=$MVM_BASE_RECIPE"; } >> "$GITHUB_OUTPUT"

    - name: Restore this repo's cached base image
      if: env.MVM_STORE == 'file' && env.MVM_DISABLE_CACHE != 'true'
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.MVM_BLOB_DIR }}/${{ steps.key.outputs.base }}.tar.zst.age
        key: mavericks-vm-base-${{ steps.key.outputs.base }}
        restore-keys: mavericks-vm-base-${{ steps.key.outputs.base }}-

    - name: Restore this repo's cached layer image
      if: env.MVM_STORE == 'file' && env.MVM_DISABLE_CACHE != 'true'
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.MVM_BLOB_DIR }}/${{ steps.key.outputs.layer }}.tar.zst.age
        key: mavericks-vm-layer-${{ steps.key.outputs.layer }}
        restore-keys: mavericks-vm-layer-${{ steps.key.outputs.layer }}-

    - name: Restore this repo's cached prepared image
      if: env.MVM_STORE == 'file' && env.MVM_DISABLE_CACHE != 'true' && steps.key.outputs.prepared != ''
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ env.MVM_BLOB_DIR }}/${{ steps.key.outputs.prepared }}.tar.zst.age
        key: mavericks-vm-prepared-${{ steps.key.outputs.prepared }}
        restore-keys: mavericks-vm-prepared-${{ steps.key.outputs.prepared }}-

    # spec: tests/safety.bats -- the .debs this runner image lacks, kept per image and package list
    #       (install-tools.sh says why: one runner in six got the archive at ~70 kB/s on
    #       2026-10-26). Only a GitHub-hosted runner names its image; on any other, no key, no
    #       cache, and apt fetches every run, as the step says.
    - name: The apt packages' cache key
      id: debs
      shell: bash
      run: |
        if [ -n "${ImageOS:-}" ] && [ -n "${ImageVersion:-}" ]; then
          list="$(bash "$GITHUB_ACTION_PATH/scripts/install-tools.sh" --packages | sha256sum | cut -c1-16)"
          echo "key=mavericks-vm-debs-$ImageOS-$ImageVersion-$list" >> "$GITHUB_OUTPUT"
        else
          echo "mavericks-vm: this runner names no image (ImageOS, ImageVersion), so apt fetches its packages every run"
        fi

    - name: Restore the apt packages this runner image lacks
      if: steps.debs.outputs.key != ''
      uses: actions/cache/restore@v6.1.0
      with:
        path: ${{ runner.temp }}/mavericks-vm-debs
        key: ${{ steps.debs.outputs.key }}

    - name: Install QEMU, age, oras and packer
      id: tools
      shell: bash
      env:
        MVM_DEBS_DIR: ${{ steps.debs.outputs.key != '' && format('{0}/mavericks-vm-debs', runner.temp) || '' }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install-tools.sh"

    - name: Save the apt packages this run fetched
      if: steps.tools.outputs.debs-save == 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ runner.temp }}/mavericks-vm-debs
        key: ${{ steps.debs.outputs.key }}

    # spec: tests/safety.bats -- the only step that receives image-key; the input check above learns
    #       only whether it was given
    - name: Run in Mavericks
      id: main
      shell: bash
      env:
        MVM_PREPARE: ${{ inputs.prepare }}
        MVM_RUN: ${{ inputs.run }}
        MVM_IMAGE_KEY: ${{ inputs.image-key }}
        MVM_TOKEN: ${{ inputs.token }}
        MVM_BASE_RECIPE: ${{ steps.key.outputs.recipe }}
      run: bash "$GITHUB_ACTION_PATH/scripts/main.sh"

    # spec: tests/image.bats -- a cache entry's name can never be reused, so each save gets a new
    #       one; when a guest is rebuilt because the cached one would not decrypt, restore's prefix
    #       match then takes the newer entry, and the old one ages out
    - name: Save the base image this run cached
      if: always() && steps.main.outputs.cache-save-base == 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ env.MVM_BLOB_DIR }}/${{ steps.key.outputs.base }}.tar.zst.age
        key: mavericks-vm-base-${{ steps.key.outputs.base }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Save the layer image this run cached
      if: always() && steps.main.outputs.cache-save-layer == 'true'
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ env.MVM_BLOB_DIR }}/${{ steps.key.outputs.layer }}.tar.zst.age
        key: mavericks-vm-layer-${{ steps.key.outputs.layer }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Save the prepared image this run cached
      if: always() && steps.main.outputs.cache-save-prepared == 'true' && steps.key.outputs.prepared != ''
      uses: actions/cache/save@v6.1.0
      with:
        path: ${{ env.MVM_BLOB_DIR }}/${{ steps.key.outputs.prepared }}.tar.zst.age
        key: mavericks-vm-prepared-${{ steps.key.outputs.prepared }}-${{ github.run_id }}-${{ github.run_attempt }}
