name: evict

# spec: docs/superpowers/specs/2026-10-06-mavericks-vm-design.md "The cache" (in packer-plugin-macosx)
#       -- prune cached guests older than 30 days, never the current base and layer keys; the
#       registry reports no last-pulled time, so age is by creation
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  evict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Delete cached guests older than 30 days, except the current keys
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # spec: tests/key.bats -- one fetch of the plugin's base recipe, handed to both keys
          #       in MVM_BASE_RECIPE, so neither key fetches it around the other
          MVM_BASE_RECIPE="$(bash scripts/key.sh --recipe)"; export MVM_BASE_RECIPE
          keep_base="$(bash scripts/key.sh --base)"
          keep_layer="$(bash scripts/key.sh --layer)"
          cutoff="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh api --paginate "orgs/Mavergreen/packages/container/mavericks-vm-images/versions" \
            --jq ".[] | select(.created_at < \"$cutoff\") | select((.metadata.container.tags | index(\"$keep_base\") or index(\"$keep_layer\")) | not) | .id" \
          | while read -r id; do
              echo "deleting package version $id"
              gh api -X DELETE "orgs/Mavergreen/packages/container/mavericks-vm-images/versions/$id"
            done
