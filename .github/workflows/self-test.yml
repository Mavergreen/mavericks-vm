name: self-test

# spec: docs/superpowers/plans/2026-10-06-mavericks-vm.md Task 12 (in packer-plugin-macosx) -- the
#       Action used on itself against the real cached guest: one guest per job (each binds the same
#       SSH port), so the sync modes and a CPU model are a matrix.
# spec: tests/self_test_workflow.bats -- one warm job builds and pushes the shared guest if its key
#       is cold, and the matrix waits for it: on a cold key, three jobs that each built and pushed
#       the same guest raced (Actions run 37539764898), and the matrix should test the hit every
#       consumer gets
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: >-
    self-test-${{ github.event_name == 'pull_request'
                  && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  warm:
    # spec: README.md -- a fork's pull request has no image-key, and is told so by the Action itself;
    #       skipping it here keeps a fork's PR from going red for that alone
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # spec: tests/self_test_workflow.bats -- the space check's thresholds are measured peaks:
      #       free space on the data disk every 5 s while the Action runs (the sampler outlives
      #       this step, to the end of the job)
      - name: Sample the data disk while the Action runs
        run: |
          df -Pk /mnt | awk 'NR == 2 { print $4 }' > "$RUNNER_TEMP/free-before.kib"
          ( while :; do df -Pk /mnt | awk 'NR == 2 { print $4 }' >> "$RUNNER_TEMP/free.kib"; sleep 5; done ) > /dev/null 2>&1 &
      - uses: ./
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          debug-on-error: true
          sync: 'no'
          run: test "$(sw_vers -productVersion)" = 10.9.5
      - name: The data disk's peak use
        if: always()
        run: |
          before="$(cat "$RUNNER_TEMP/free-before.kib")"; low="$(sort -n "$RUNNER_TEMP/free.kib" | head -n 1)"
          echo "peak use: $(( (before - low) / 1024 / 1024 )) GiB (free before: $(( before / 1024 / 1024 )) GiB, lowest: $(( low / 1024 / 1024 )) GiB)"

  guest:
    needs: warm
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sync: rsync, cpu-model: 'Penryn,vendor=GenuineIntel,+ssse3,+sse4.1,+sse4.2', brand: Penryn }
          # spec: tests/inputs.bats -- Nehalem names no vendor, so the Action adds GenuineIntel's
          - { sync: scp, cpu-model: Nehalem, brand: Nehalem }
          - { sync: tar, cpu-model: 'Penryn,vendor=GenuineIntel,+ssse3,+sse4.1,+sse4.2', brand: Penryn }
          - { sync: rsync, cpu-model: 'Penryn,vendor=GenuineIntel,+ssse3,+sse4.1,+sse4.2', brand: Penryn, cache-store: repo }
    steps:
      - uses: actions/checkout@v7
      - name: Record the runner
        run: |
          grep -m1 'model name' /proc/cpuinfo; grep -m1 vendor_id /proc/cpuinfo
          df -h / /mnt; nproc; free -g
      # spec: tests/self_test_workflow.bats -- the space check's thresholds are measured peaks:
      #       free space on the data disk every 5 s while the Action runs (the sampler outlives
      #       this step, to the end of the job)
      - name: Sample the data disk while the Action runs
        run: |
          df -Pk /mnt | awk 'NR == 2 { print $4 }' > "$RUNNER_TEMP/free-before.kib"
          ( while :; do df -Pk /mnt | awk 'NR == 2 { print $4 }' >> "$RUNNER_TEMP/free.kib"; sleep 5; done ) > /dev/null 2>&1 &
      - uses: ./
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          sync: ${{ matrix.sync }}
          cpu-model: ${{ matrix.cpu-model }}
          cache-store: ${{ matrix.cache-store || 'auto' }}
          debug-on-error: true
          envs: 'ROUNDTRIP'
          run: |
            test "$(sw_vers -productVersion)" = 10.9.5
            test "$(sw_vers -buildVersion)" = 13F1911
            sysctl -n machdep.cpu.brand_string | grep -q '${{ matrix.brand }}'
            test "$(pwd)" = "$GITHUB_WORKSPACE" || test "$(pwd)" = '${{ github.workspace }}'
            printf '%s\n' "$ROUNDTRIP" > roundtrip.txt
        env:
          ROUNDTRIP: from the guest via ${{ matrix.sync }}
      - name: The data disk's peak use
        if: always()
        run: |
          before="$(cat "$RUNNER_TEMP/free-before.kib")"; low="$(sort -n "$RUNNER_TEMP/free.kib" | head -n 1)"
          echo "peak use: $(( (before - low) / 1024 / 1024 )) GiB (free before: $(( before / 1024 / 1024 )) GiB, lowest: $(( low / 1024 / 1024 )) GiB)"
      - name: The guest's file came back
        run: test "$(cat roundtrip.txt)" = 'from the guest via ${{ matrix.sync }}'
      - name: Later steps reach the guest
        shell: mavericks {0}
        run: test "$(sw_vers -productVersion)" = 10.9.5
